<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Maze: Lava Escape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #03030a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #menuScreen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 10, 26, 0.78);
      backdrop-filter: blur(14px);
      padding: 44px 60px;
      border-radius: 24px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.25), inset 0 0 25px rgba(255, 0, 127, 0.2);
      text-align: center;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    h1 {
      font-size: 3.2rem;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #00f0ff 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 900;
      filter: drop-shadow(0 0 20px rgba(255, 0, 127, 0.4));
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1.05rem;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .warning-text {
      color: #ff5533;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 24px;
      text-shadow: 0 0 10px rgba(255, 68, 0, 0.6);
    }

    .difficulty-row {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .diff-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .diff-btn.active {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .btn-start {
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      color: #fff;
      border: none;
      padding: 16px 54px;
      font-size: 1.3rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
      transition: all 0.3s;
    }

    .btn-start:hover {
      transform: scale(1.06);
      box-shadow: 0 0 45px rgba(0, 240, 255, 0.85);
    }

    #gameScreen {
      position: relative;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 620px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 14px;
      border: 1px solid #334155;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .hud-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }

    .best-badge {
      color: #facc15;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
    }

    .lava-badge {
      color: #ff5533;
      text-shadow: 0 0 10px rgba(255, 68, 0, 0.6);
      font-weight: 800;
    }

    .hud-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    .hud-btn:hover {
      background: #334155;
    }

    #mazeCanvas {
      background: #080a14;
      border: 2px solid #00f0ff;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.35);
    }

    #fireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Модальные окна победы и гибели */
    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 10, 28, 0.96);
      backdrop-filter: blur(14px);
      padding: 42px 64px;
      border-radius: 26px;
      text-align: center;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    #winModal {
      border: 2px solid #38ef7d;
      box-shadow: 0 0 70px rgba(56, 239, 125, 0.6);
    }

    #winModal h2 {
      font-size: 2.4rem;
      color: #38ef7d;
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(56, 239, 125, 0.7);
      text-transform: uppercase;
      font-weight: 900;
    }

    #deathModal {
      border: 2px solid #ff2200;
      box-shadow: 0 0 70px rgba(255, 34, 0, 0.75);
    }

    #deathModal h2 {
      font-size: 2.4rem;
      color: #ff3b30;
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(255, 59, 48, 0.8);
      text-transform: uppercase;
      font-weight: 900;
    }

    .modal-text {
      font-size: 1.15rem;
      color: #e2e8f0;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    .btn-again {
      background: linear-gradient(90deg, #11998e, #38ef7d);
      color: #03140b;
      border: none;
      padding: 15px 42px;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 239, 125, 0.5);
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-retry {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: #fff;
      border: none;
      padding: 15px 42px;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 75, 43, 0.6);
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-again:hover, .btn-retry:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div id="menuScreen">
    <h1>CYBER MAZE</h1>
    <p class="subtitle">Управление: Удерживайте стрелки или WASD для плавной езды</p>
    <p class="warning-text">⚠️ БЕГИ: Лава начнёт заливать лабиринт сзади!</p>
    
    <div class="difficulty-row">
      <button class="diff-btn" data-size="19" data-speed="2.3">Быстрый (19x19)</button>
      <button class="diff-btn active" data-size="27" data-speed="2.6">Большой (27x27)</button>
      <button class="diff-btn" data-size="33" data-speed="3.1">Гигант (33x33)</button>
    </div>

    <button class="btn-start" id="startBtn">НАЧАТЬ ИГРУ</button>
  </div>

  <div id="gameScreen">
    <div class="hud">
      <div class="hud-badge">⏱ Время: <span id="timeVal">00:00</span></div>
      <div class="hud-badge best-badge">🏆 Рекорд: <span id="bestTimeVal">--:--</span></div>
      <div class="hud-badge lava-badge" id="lavaIndicator">🔥 Лава спит...</div>
      <button class="hud-btn" id="exitMenuBtn">В меню</button>
    </div>
    <canvas id="mazeCanvas"></canvas>
  </div>

  <canvas id="fireworksCanvas"></canvas>

  <!-- Окно победы -->
  <div id="winModal" class="modal">
    <h2>🎉 ТЫ СБЕЖАЛ! 🎉</h2>
    <p id="winStats" class="modal-text">Лабиринт успешно пройден!</p>
    <button class="btn-again" id="playAgainBtn">Играть снова</button>
  </div>

  <!-- Окно гибели от лавы -->
  <div id="deathModal" class="modal">
    <h2>💀 ТЕБЯ НАГНАЛА ЛАВА! 💀</h2>
    <p id="deathStats" class="modal-text">Жар поглотил коридоры. Не останавливайся ни на секунду!</p>
    <button class="btn-retry" id="retryBtn">Попробовать заново</button>
  </div>

  <script>
    // Аудио эффекты на Web Audio API
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playWin() {
        if (!this.ctx) return;
        const notes = [440, 554, 659, 880];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.12);
          osc.stop(this.ctx.currentTime + idx * 0.12 + 0.35);
        });
      },
      playDeath() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.55);
        gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.55);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.55);
      }
    };

    // ФОН: НЕОНОВАЯ ДОРОГА
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgTime = 0;

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    function drawBackground() {
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      bgTime += 0.035;

      const skyGrad = bgCtx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#040212');
      skyGrad.addColorStop(0.5, '#1e0436');
      skyGrad.addColorStop(1, '#000000');
      bgCtx.fillStyle = skyGrad;
      bgCtx.fillRect(0, 0, w, h);

      const horizonY = h * 0.44;
      const sunGrad = bgCtx.createLinearGradient(0, horizonY - 130, 0, horizonY);
      sunGrad.addColorStop(0, '#ff007f');
      sunGrad.addColorStop(1, '#ffe600');
      bgCtx.fillStyle = sunGrad;
      bgCtx.beginPath();
      bgCtx.arc(w / 2, horizonY, 115, Math.PI, 0, false);
      bgCtx.fill();

      bgCtx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      bgCtx.lineWidth = 1.5;
      for (let x = -w; x <= w * 2; x += 90) {
        bgCtx.beginPath();
        bgCtx.moveTo(w / 2, horizonY);
        bgCtx.lineTo(x, h);
        bgCtx.stroke();
      }

      const gridOffset = (bgTime * 65) % 40;
      for (let y = horizonY; y <= h; y += 40) {
        const curY = y + gridOffset;
        if (curY > horizonY && curY <= h) {
          bgCtx.beginPath();
          bgCtx.moveTo(0, curY);
          bgCtx.lineTo(w, curY);
          bgCtx.stroke();
        }
      }

      // Спорткар
      const carX = w / 2;
      const carY = h * 0.72;

      const glowGrad = bgCtx.createRadialGradient(carX, carY + 36, 15, carX, carY + 36, 130);
      glowGrad.addColorStop(0, 'rgba(0, 240, 255, 0.95)');
      glowGrad.addColorStop(0.5, 'rgba(255, 0, 128, 0.55)');
      glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      bgCtx.fillStyle = glowGrad;
      bgCtx.beginPath();
      bgCtx.ellipse(carX, carY + 36, 145, 32, 0, 0, Math.PI * 2);
      bgCtx.fill();

      bgCtx.fillStyle = '#0f1124';
      bgCtx.beginPath();
      bgCtx.roundRect(carX - 100, carY - 25, 200, 60, [16, 16, 6, 6]);
      bgCtx.fill();
      bgCtx.strokeStyle = '#00f0ff';
      bgCtx.lineWidth = 2;
      bgCtx.stroke();

      bgCtx.fillStyle = '#060714';
      bgCtx.beginPath();
      bgCtx.moveTo(carX - 65, carY - 25);
      bgCtx.lineTo(carX - 45, carY - 65);
      bgCtx.lineTo(carX + 45, carY - 65);
      bgCtx.lineTo(carX + 65, carY - 25);
      bgCtx.closePath();
      bgCtx.fill();
      bgCtx.strokeStyle = '#ff007f';
      bgCtx.stroke();

      bgCtx.fillStyle = '#1e0533';
      bgCtx.fillRect(carX - 110, carY - 50, 220, 8);
      bgCtx.fillStyle = '#00f0ff';
      bgCtx.fillRect(carX - 70, carY - 42, 6, 17);
      bgCtx.fillRect(carX + 64, carY - 42, 6, 17);

      bgCtx.shadowColor = '#ff0055';
      bgCtx.shadowBlur = 22;
      bgCtx.fillStyle = '#ff0055';
      bgCtx.fillRect(carX - 90, carY - 5, 180, 8);
      bgCtx.fillStyle = '#fff';
      bgCtx.fillRect(carX - 85, carY - 3, 170, 4);
      bgCtx.shadowBlur = 0;

      const flamePulse = Math.sin(bgTime * 22) * 8;
      const drawFlame = (fx) => {
        bgCtx.shadowColor = '#00f0ff';
        bgCtx.shadowBlur = 18;
        bgCtx.fillStyle = '#00f0ff';
        bgCtx.beginPath();
        bgCtx.moveTo(fx - 6, carY + 32);
        bgCtx.lineTo(fx + 6, carY + 32);
        bgCtx.lineTo(fx, carY + 46 + flamePulse);
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.shadowBlur = 0;
      };
      drawFlame(carX - 45);
      drawFlame(carX + 45);

      requestAnimationFrame(drawBackground);
    }
    drawBackground();

    // ЛОГИКА ЛАБИРИНТА, ИГРОКА И ЛАВЫ
    const mazeCanvas = document.getElementById('mazeCanvas');
    const mazeCtx = mazeCanvas.getContext('2d');
    const menuScreen = document.getElementById('menuScreen');
    const gameScreen = document.getElementById('gameScreen');
    const startBtn = document.getElementById('startBtn');
    const winModal = document.getElementById('winModal');
    const deathModal = document.getElementById('deathModal');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const retryBtn = document.getElementById('retryBtn');
    const exitMenuBtn = document.getElementById('exitMenuBtn');
    const bestTimeVal = document.getElementById('bestTimeVal');
    const lavaIndicator = document.getElementById('lavaIndicator');

    let mazeSize = 27;
    let baseLavaSpeed = 2.6; // блоков в секунду
    let cellSize = 18;
    let maze = [];
    let lavaDistances = []; // дистанция по коридорам от старта (1,1)
    let goal = { x: 1, y: 1 };
    let gameActive = false;
    let startTime = 0;
    let elapsedSeconds = 0;
    let gameAnimFrame = null;
    let lavaWave = 0; // текущая волна лавы в блоках

    // Игрок с глазками
    const player = {
      x: 0,
      y: 0,
      radius: 6,
      speed: 130,
      lookX: 0,
      lookY: 0,
      blinkTimer: 0
    };

    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateBestTimeDisplay() {
      const record = localStorage.getItem('cyber_best_' + mazeSize);
      bestTimeVal.textContent = record ? formatTime(parseInt(record, 10)) : '--:--';
    }

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mazeSize = parseInt(btn.dataset.size, 10);
        baseLavaSpeed = parseFloat(btn.dataset.speed);
        updateBestTimeDisplay();
      });
    });

    // Генерация лабиринта (DFS)
    function generateMaze(size) {
      const grid = Array.from({ length: size }, () => Array(size).fill(1));
      const stack = [[1, 1]];
      grid[1][1] = 0;

      while (stack.length > 0) {
        const [cx, cy] = stack[stack.length - 1];
        const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
        dirs.sort(() => Math.random() - 0.5);

        let moved = false;
        for (const [dx, dy] of dirs) {
          const nx = cx + dx;
          const ny = cy + dy;
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && grid[ny][nx] === 1) {
            grid[cy + dy / 2][cx + dx / 2] = 0;
            grid[ny][nx] = 0;
            stack.push([nx, ny]);
            moved = true;
            break;
          }
        }
        if (!moved) stack.pop();
      }
      return grid;
    }

    // Расчёт пути лавы от точки старта (BFS)
    function computeLavaDistances() {
      lavaDistances = Array.from({ length: mazeSize }, () => Array(mazeSize).fill(-1));
      const queue = [[1, 1, 0]];
      lavaDistances[1][1] = 0;

      while (queue.length > 0) {
        const [cx, cy, dist] = queue.shift();
        const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
        for (const [dx, dy] of dirs) {
          const nx = cx + dx;
          const ny = cy + dy;
          if (nx >= 0 && nx < mazeSize && ny >= 0 && ny < mazeSize) {
            if (maze[ny][nx] === 0 && lavaDistances[ny][nx] === -1) {
              lavaDistances[ny][nx] = dist + 1;
              queue.push([nx, ny, dist + 1]);
            }
          }
        }
      }
    }

    function setupCanvasSize() {
      const maxAvailable = Math.min(window.innerHeight - 150, window.innerWidth - 40, 580);
      cellSize = Math.floor(maxAvailable / mazeSize);
      mazeCanvas.width = mazeSize * cellSize;
      mazeCanvas.height = mazeSize * cellSize;
      player.radius = cellSize * 0.32;
      player.speed = cellSize * 7.5;
    }

    // Проверка столкновений со стенами
    function collidesWithWall(x, y, r) {
      const minX = Math.floor((x - r) / cellSize);
      const maxX = Math.floor((x + r) / cellSize);
      const minY = Math.floor((y - r) / cellSize);
      const maxY = Math.floor((y + r) / cellSize);

      for (let cy = minY; cy <= maxY; cy++) {
        for (let cx = minX; cx <= maxX; cx++) {
          if (cy < 0 || cy >= mazeSize || cx < 0 || cx >= mazeSize || maze[cy][cx] === 1) {
            const rx = cx * cellSize;
            const ry = cy * cellSize;
            const closestX = Math.max(rx, Math.min(x, rx + cellSize));
            const closestY = Math.max(ry, Math.min(y, ry + cellSize));
            const distX = x - closestX;
            const distY = y - closestY;
            if ((distX * distX + distY * distY) < (r * r)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Проверка касания лавы
    function collidesWithLava(px, py, r) {
      const minX = Math.max(0, Math.floor((px - r) / cellSize));
      const maxX = Math.min(mazeSize - 1, Math.floor((px + r) / cellSize));
      const minY = Math.max(0, Math.floor((py - r) / cellSize));
      const maxY = Math.min(mazeSize - 1, Math.floor((py + r) / cellSize));

      for (let cy = minY; cy <= maxY; cy++) {
        for (let cx = minX; cx <= maxX; cx++) {
          const cellDist = lavaDistances[cy][cx];
          if (cellDist !== -1 && cellDist <= lavaWave) {
            // Клетка заполнена лавой
            const rx = cx * cellSize;
            const ry = cy * cellSize;
            const closestX = Math.max(rx, Math.min(px, rx + cellSize));
            const closestY = Math.max(ry, Math.min(py, ry + cellSize));
            const distX = px - closestX;
            const distY = py - closestY;
            if ((distX * distX + distY * distY) < (r * r)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // Рисование игрока с глазками
    function drawPlayer() {
      const { x, y, radius, lookX, lookY, blinkTimer } = player;

      mazeCtx.shadowColor = '#00f0ff';
      mazeCtx.shadowBlur = 16;
      mazeCtx.fillStyle = '#00f0ff';
      mazeCtx.beginPath();
      mazeCtx.arc(x, y, radius, 0, Math.PI * 2);
      mazeCtx.fill();
      mazeCtx.shadowBlur = 0;

      // Глазки
      const eyeOffsetX = radius * 0.36;
      const eyeOffsetY = -radius * 0.12;
      const eyeSize = radius * 0.28;
      const pupilSize = eyeSize * 0.55;
      const isBlinking = (blinkTimer % 180 > 172);

      const drawEye = (ex) => {
        if (isBlinking) {
          mazeCtx.strokeStyle = '#05111e';
          mazeCtx.lineWidth = 1.6;
          mazeCtx.beginPath();
          mazeCtx.moveTo(ex - eyeSize, y + eyeOffsetY);
          mazeCtx.lineTo(ex + eyeSize, y + eyeOffsetY);
          mazeCtx.stroke();
        } else {
          mazeCtx.fillStyle = '#ffffff';
          mazeCtx.beginPath();
          mazeCtx.arc(ex, y + eyeOffsetY, eyeSize, 0, Math.PI * 2);
          mazeCtx.fill();

          mazeCtx.fillStyle = '#05111e';
          mazeCtx.beginPath();
          mazeCtx.arc(
            ex + lookX * (eyeSize * 0.45),
            y + eyeOffsetY + lookY * (eyeSize * 0.45),
            pupilSize,
            0,
            Math.PI * 2
          );
          mazeCtx.fill();
        }
      };

      drawEye(x - eyeOffsetX);
      drawEye(x + eyeOffsetX);
    }

    // Отрисовка сцены (стены, лава, портал, герой)
    function renderGame(timeNow) {
      mazeCtx.clearRect(0, 0, mazeCanvas.width, mazeCanvas.height);

      const pulse = Math.sin(timeNow * 0.008) * 0.15 + 0.85;

      // Проход по сетке
      for (let cy = 0; cy < mazeSize; cy++) {
        for (let cx = 0; cx < mazeSize; cx++) {
          const isWall = (maze[cy][cx] === 1);
          const cellLavaDist = lavaDistances[cy][cx];

          if (isWall) {
            mazeCtx.fillStyle = '#141828';
            mazeCtx.fillRect(cx * cellSize, cy * cellSize, cellSize, cellSize);
            mazeCtx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            mazeCtx.strokeRect(cx * cellSize, cy * cellSize, cellSize, cellSize);
          } else if (cellLavaDist !== -1 && cellLavaDist <= lavaWave) {
            // Лава
            const isFrontier = Math.abs(cellLavaDist - lavaWave) < 1.5;
            mazeCtx.fillStyle = isFrontier ? `rgba(255, 120, 20, ${pulse})` : '#e62200';
            mazeCtx.fillRect(cx * cellSize, cy * cellSize, cellSize, cellSize);

            // Огненные прожилки лавы
            mazeCtx.fillStyle = '#ffbb00';
            mazeCtx.fillRect(cx * cellSize + 3, cy * cellSize + 3, cellSize - 6, cellSize - 6);
          }
        }
      }

      // Золотой портал выхода
      const portalRadius = cellSize * 0.38;
      const goalCenterX = (goal.x + 0.5) * cellSize;
      const goalCenterY = (goal.y + 0.5) * cellSize;

      mazeCtx.fillStyle = '#facc15';
      mazeCtx.shadowColor = '#facc15';
      mazeCtx.shadowBlur = 18;
      mazeCtx.beginPath();
      mazeCtx.arc(goalCenterX, goalCenterY, portalRadius, 0, Math.PI * 2);
      mazeCtx.fill();
      mazeCtx.shadowBlur = 0;

      // Игрок
      drawPlayer();
    }

    let lastTime = performance.now();

    function updateGameLoop(now) {
      if (!gameActive) return;

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const totalElapsed = (now - startTime) / 1000;
      elapsedSeconds = Math.floor(totalElapsed);
      document.getElementById('timeVal').textContent = formatTime(elapsedSeconds);

      // Логика лавы: 2 секунды форы игроку
      const gracePeriod = 2.0;
      if (totalElapsed > gracePeriod) {
        lavaWave = (totalElapsed - gracePeriod) * baseLavaSpeed;
        lavaIndicator.textContent = '🔥 ЛАВА БЛИЗКО!';
        lavaIndicator.style.color = '#ff3300';
      } else {
        lavaWave = -1;
        const remainingGrace = (gracePeriod - totalElapsed).toFixed(1);
        lavaIndicator.textContent = `⏳ Лава через ${remainingGrace}с`;
        lavaIndicator.style.color = '#38bdf8';
      }

      // Плавное передвижение
      let moveX = 0;
      let moveY = 0;
      if (keys.up) moveY -= 1;
      if (keys.down) moveY += 1;
      if (keys.left) moveX -= 1;
      if (keys.right) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        const normX = moveX / len;
        const normY = moveY / len;

        player.lookX = normX;
        player.lookY = normY;

        const stepX = normX * player.speed * dt;
        const stepY = normY * player.speed * dt;

        // Скольжение вдоль стен
        if (!collidesWithWall(player.x + stepX, player.y, player.radius)) {
          player.x += stepX;
        }
        if (!collidesWithWall(player.x, player.y + stepY, player.radius)) {
          player.y += stepY;
        }
      }

      player.blinkTimer++;

      // Проверка гибели от лавы
      if (collidesWithLava(player.x, player.y, player.radius)) {
        onDeath();
        return;
      }

      // Проверка победы (касание портала)
      const goalDist = Math.hypot(
        player.x - (goal.x + 0.5) * cellSize,
        player.y - (goal.y + 0.5) * cellSize
      );

      if (goalDist < cellSize * 0.5) {
        onVictory();
        return;
      }

      renderGame(now);
      gameAnimFrame = requestAnimationFrame(updateGameLoop);
    }

    function onVictory() {
      gameActive = false;
      AudioEngine.playWin();

      const prevRecord = localStorage.getItem('cyber_best_' + mazeSize);
      let recordMessage = '';
      if (!prevRecord || elapsedSeconds < parseInt(prevRecord, 10)) {
        localStorage.setItem('cyber_best_' + mazeSize, elapsedSeconds);
        updateBestTimeDisplay();
        recordMessage = `<br><span style="color:#facc15; font-weight:bold;">🔥 НОВЫЙ РЕКОРД: ${formatTime(elapsedSeconds)}!</span>`;
      }

      document.getElementById('winStats').innerHTML = 
        `Время побега: <b>${formatTime(elapsedSeconds)}</b>${recordMessage}`;
      winModal.style.display = 'flex';
      launchFireworks();
    }

    function onDeath() {
      gameActive = false;
      AudioEngine.playDeath();

      // Рисуем вспышку гибели
      mazeCtx.fillStyle = 'rgba(255, 30, 0, 0.4)';
      mazeCtx.fillRect(0, 0, mazeCanvas.width, mazeCanvas.height);

      document.getElementById('deathStats').innerHTML = 
        `Ты продержался: <b>${formatTime(elapsedSeconds)}</b>.<br>Не сбавляй темп и держись подальше от огня!`;
      deathModal.style.display = 'flex';
    }

    function startNewGame() {
      AudioEngine.init();
      setupCanvasSize();
      updateBestTimeDisplay();

      maze = generateMaze(mazeSize);
      computeLavaDistances();

      player.x = (1 + 0.5) * cellSize;
      player.y = (1 + 0.5) * cellSize;
      player.lookX = 0;
      player.lookY = 0;
      goal = { x: mazeSize - 2, y: mazeSize - 2 };

      keys.up = keys.down = keys.left = keys.right = false;

      startTime = performance.now();
      lastTime = performance.now();
      elapsedSeconds = 0;
      lavaWave = -1;
      gameActive = true;

      document.getElementById('timeVal').textContent = '00:00';
      menuScreen.style.display = 'none';
      winModal.style.display = 'none';
      deathModal.style.display = 'none';
      gameScreen.style.display = 'flex';

      cancelAnimationFrame(gameAnimFrame);
      gameAnimFrame = requestAnimationFrame(updateGameLoop);
    }

    startBtn.addEventListener('click', startNewGame);
    playAgainBtn.addEventListener('click', startNewGame);
    retryBtn.addEventListener('click', startNewGame);

    exitMenuBtn.addEventListener('click', () => {
      gameActive = false;
      cancelAnimationFrame(gameAnimFrame);
      gameScreen.style.display = 'none';
      winModal.style.display = 'none';
      deathModal.style.display = 'none';
      menuScreen.style.display = 'flex';
    });

    // Обработка клавиш (плавное удержание)
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { keys.up = true; e.preventDefault(); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { keys.down = true; e.preventDefault(); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { keys.left = true; e.preventDefault(); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { keys.right = true; e.preventDefault(); }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
    });

    // Салют при победе
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let particles = [];
    let fireworksInterval = null;

    function resizeFw() {
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFw);
    resizeFw();

    function createFirework() {
      const sx = Math.random() * (fwCanvas.width * 0.8) + fwCanvas.width * 0.1;
      const sy = Math.random() * (fwCanvas.height * 0.5) + fwCanvas.height * 0.1;
      const colors = ['#00f0ff', '#ff007f', '#facc15', '#38ef7d', '#ffffff', '#a855f7'];

      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6.5 + 2;
        particles.push({
          x: sx,
          y: sy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function animateFireworks() {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          fwCtx.fillStyle = p.color;
          fwCtx.globalAlpha = p.alpha;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
          fwCtx.fill();
        }
      }
      fwCtx.globalAlpha = 1;

      if (!gameActive && winModal.style.display === 'flex') {
        requestAnimationFrame(animateFireworks);
      } else {
        fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      }
    }

    function launchFireworks() {
      particles = [];
      createFirework();
      createFirework();
      animateFireworks();

      clearInterval(fireworksInterval);
      fireworksInterval = setInterval(() => {
        if (!gameActive && winModal.style.display === 'flex') {
          createFirework();
        } else {
          clearInterval(fireworksInterval);
        }
      }, 650);
    }
  </script>
</body>
