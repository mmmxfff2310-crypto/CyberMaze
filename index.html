<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spa Granted — MSK Clock & Timer</title>
  <!-- Шрифт в стиле iOS Lock Screen (Rounded Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=SF+Pro+Display:wght@700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070a;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Фоновый плеер (4K видео > 50 мин) */
    .video-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 115vw;
      height: 115vh;
      min-width: 177.77vh; /* 16:9 пропорции на весь экран без рамок */
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: none;
      filter: brightness(0.85) contrast(1.05);
    }

    /* Мягкое затемнение для читаемости */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Центральный блок с часами */
    .center-stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* Плашка "Spa Granted" над временем */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
    }

    /* Прозрачный шрифт как на iPhone Lock Screen */
    .iphone-clock {
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(5.5rem, 17vw, 13.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      
      /* Эффект полупрозрачного стекла на цифрах */
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.88) 0%,
        rgba(255, 255, 255, 0.36) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
      filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.38));
      transition: transform 0.3s ease;
    }

    /* Дата и пометка МСК снизу */
    .sub-info {
      margin-top: 14px;
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    /* Панель управления таймером (появляется при переключении) */
    .timer-controls {
      margin-top: 24px;
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(20, 24, 32, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .timer-controls.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .glass-btn.primary {
      background: rgba(74, 222, 128, 0.28);
      border-color: rgba(74, 222, 128, 0.6);
    }

    .timer-input {
      width: 68px;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 14px;
      text-align: center;
      outline: none;
    }

    /* Кнопка часов скраю экрана */
    .side-toggle-btn {
      position: fixed;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .side-toggle-btn:hover {
      transform: translateY(-50%) scale(1.08);
      background: rgba(255, 255, 255, 0.25);
    }

    .side-toggle-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .side-toggle-btn svg {
      width: 26px;
      height: 26px;
    }

    /* Кнопка смены 4K фона внизу слева */
    .bg-switcher {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .side-toggle-btn {
        right: 16px;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .side-toggle-btn:hover {
        transform: scale(1.06);
      }
    }
  </style>
</head>
<body>

  <!-- Фоновое 4K видео (> 50 минут) -->
  <div class="video-bg">
    <iframe
      id="bgFrame"
      src="https://www.youtube.com/embed/LXb3EKWsInQ?autoplay=1&mute=1&controls=0&loop=1&playlist=LXb3EKWsInQ&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&vq=hd2160"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="vignette"></div>

  <!-- Основной экран -->
  <main class="center-stage">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Spa Granted</span>
    </div>

    <div id="mainDisplay" class="iphone-clock">00:00</div>
    <div id="subInfo" class="sub-info">МОСКВА (MSK) • ЗАГРУЗКА...</div>

    <!-- Управление таймером -->
    <div id="timerControls" class="timer-controls">
      <button class="glass-btn" onclick="setPreset(5)">5 мин</button>
      <button class="glass-btn" onclick="setPreset(15)">15 мин</button>
      <button class="glass-btn" onclick="setPreset(25)">25 мин</button>
      <button class="glass-btn" onclick="setPreset(50)">50 мин</button>
      <input type="number" id="customMinutes" class="timer-input" min="1" max="999" placeholder="Мин" />
      <button class="glass-btn" onclick="applyCustomMinutes()">ОК</button>
      <button id="startPauseBtn" class="glass-btn primary" onclick="toggleTimer()">Старт</button>
      <button class="glass-btn" onclick="resetTimer()">Сброс</button>
    </div>
  </main>

  <!-- Кнопка переключения (Часы / Таймер) скраю -->
  <button class="side-toggle-btn" id="modeToggleBtn" title="Переключить: Часы МСК / Таймер" onclick="toggleMode()">
    <!-- Иконка часов / таймера -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"></circle>
      <path d="M12 9v4l2.5 2.5"></path>
      <path d="M9 2h6"></path>
      <path d="M12 2v3"></path>
    </svg>
  </button>

  <!-- Переключатель 4K сцен (> 50 мин) -->
  <div class="bg-switcher">
    <button class="glass-btn" onclick="changeVideo('1-5G6p4207Q')">4K Ночной Токио (1ч+)</button>
    <button class="glass-btn" onclick="changeVideo('eKFTSSKCzWA')">4K Природа и вода (1ч+)</button>
    <button class="glass-btn" onclick="changeVideo('jfKfPfyJRdk')">4K Атмосфера</button>
  </div>

  <script>
    let isTimerMode = false;
    let timerSeconds = 25 * 60; // По умолчанию 25 минут
    let initialSeconds = 25 * 60;
    let timerRunning = false;
    let timerInterval = null;

    const mainDisplay = document.getElementById('mainDisplay');
    const subInfo = document.getElementById('subInfo');
    const timerControls = document.getElementById('timerControls');
    const startPauseBtn = document.getElementById('startPauseBtn');

    // Обновление времени по Москве (Europe/Moscow)
    function updateMoscowClock() {
      if (isTimerMode) return;

      const now = new Date();
      const timeOptions = {
        timeZone: 'Europe/Moscow',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      };
      const secOptions = {
        timeZone: 'Europe/Moscow',
        second: '2-digit'
      };
      const dateOptions = {
        timeZone: 'Europe/Moscow',
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      };

      const timeStr = new Intl.DateTimeFormat('ru-RU', timeOptions).format(now);
      const secStr = new Intl.DateTimeFormat('ru-RU', secOptions).format(now);
      const dateStr = new Intl.DateTimeFormat('ru-RU', dateOptions).format(now);

      mainDisplay.textContent = timeStr;
      subInfo.textContent = `МСК • ${dateStr.toUpperCase()} • ${secStr} СЕК`;
    }

    // Переключение между часами МСК и таймером
    function toggleMode() {
      isTimerMode = !isTimerMode;
      if (isTimerMode) {
        timerControls.classList.add('active');
        renderTimer();
      } else {
        timerControls.classList.remove('active');
        updateMoscowClock();
      }
    }

    function formatTimer(totalSec) {
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function renderTimer() {
      mainDisplay.textContent = formatTimer(timerSeconds);
      subInfo.textContent = timerRunning ? 'ТАЙМЕР ИДЁТ' : 'РЕЖИМ ТАЙМЕРА (НАЖМИТЕ ЧАСЫ СПРАВА ДЛЯ МСК)';
    }

    function toggleTimer() {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        startPauseBtn.textContent = 'Старт';
        renderTimer();
      } else {
        if (timerSeconds <= 0) timerSeconds = initialSeconds;
        timerRunning = true;
        startPauseBtn.textContent = 'Пауза';
        renderTimer();
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            startPauseBtn.textContent = 'Старт';
            subInfo.textContent = 'ВРЕМЯ ВЫШЛО!';
          }
        }, 1000);
      }
    }

    function setPreset(minutes) {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      initialSeconds = minutes * 60;
      timerSeconds = initialSeconds;
      renderTimer();
    }

    function applyCustomMinutes() {
      const val = parseInt(document.getElementById('customMinutes').value, 10);
      if (val && val > 0) {
        setPreset(val);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      timerSeconds = initialSeconds;
      renderTimer();
    }

    // Смена 4K фонового видео
    function changeVideo(videoId) {
      const frame = document.getElementById('bgFrame');
      frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&vq=hd2160`;
    }

    // Запуск часов
    updateMoscowClock();
    setInterval(updateMoscowClock, 1000);
  </script>
</body>
</html>
