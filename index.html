<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spa Granted — MSK Clock & Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070a;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Фоновое 4K видео (> 50 мин) */
    .video-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 115vw;
      height: 115vh;
      min-width: 177.77vh;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: none;
      filter: brightness(0.85) contrast(1.05);
    }

    /* Мягкое затемнение для читаемости */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Центральный блок */
    .center-stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* Плашка "Spa Granted" */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.92);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
    }

    /* Панель управления таймером ВЫШЕ времени */
    .timer-controls {
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(20, 24, 32, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .timer-controls.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .timer-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      margin-right: 4px;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .glass-btn.primary {
      background: rgba(74, 222, 128, 0.3);
      border-color: rgba(74, 222, 128, 0.65);
    }

    .timer-input {
      width: 62px;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 13px;
      text-align: center;
      outline: none;
    }

    /* Контейнер для часов + мини-таймера чуть выше скраю */
    .clock-wrapper {
      position: relative;
      display: inline-block;
    }

    /* Активный таймер чуть выше времени скраю (справа над цифрами) */
    .active-timer-pill {
      position: absolute;
      top: -28px;
      right: 4px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      z-index: 3;
      animation: fadeIn 0.25s ease;
    }

    .active-timer-pill.visible {
      display: inline-flex;
    }

    .timer-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }

    .active-timer-pill.finished .timer-pulse {
      background: #f87171;
      box-shadow: 0 0 10px #f87171;
    }

    /* Прозрачный шрифт как на iPhone Lock Screen */
    .iphone-clock {
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(5.5rem, 17vw, 13.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.88) 0%,
        rgba(255, 255, 255, 0.36) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
      filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.38));
    }

    /* Дата и пометка МСК снизу */
    .sub-info {
      margin-top: 14px;
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    /* Кнопка часов скраю экрана */
    .side-toggle-btn {
      position: fixed;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .side-toggle-btn:hover {
      transform: translateY(-50%) scale(1.08);
      background: rgba(255, 255, 255, 0.25);
    }

    .side-toggle-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .side-toggle-btn svg {
      width: 26px;
      height: 26px;
    }

    /* Кнопки смены 4K фона внизу слева */
    .bg-switcher {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .active-timer-pill {
        top: -34px;
        right: 0;
      }
      .side-toggle-btn {
        right: 16px;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .side-toggle-btn:hover {
        transform: scale(1.06);
      }
    }
  </style>
</head>
<body>

  <!-- Фоновое 4K видео (> 50 минут) -->
  <div class="video-bg">
    <iframe
      id="bgFrame"
      src="https://www.youtube.com/embed/eKFTSSKCzWA?autoplay=1&mute=1&controls=0&loop=1&playlist=eKFTSSKCzWA&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&vq=hd2160"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="vignette"></div>

  <!-- Основной экран -->
  <main class="center-stage">
    <!-- Надпись Spa Granted -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Spa Granted</span>
    </div>

    <!-- Панель настройки таймера (открывается по кнопке часов скраю) -->
    <div id="timerControls" class="timer-controls">
      <span class="timer-label">ТАЙМЕР:</span>
      <button class="glass-btn" onclick="setPreset(5)">5 мин</button>
      <button class="glass-btn" onclick="setPreset(15)">15 мин</button>
      <button class="glass-btn" onclick="setPreset(25)">25 мин</button>
      <button class="glass-btn" onclick="setPreset(50)">50 мин</button>
      <input type="number" id="customMinutes" class="timer-input" min="1" max="999" placeholder="Мин" />
      <button class="glass-btn" onclick="applyCustomMinutes()">ОК</button>
      <button id="startPauseBtn" class="glass-btn primary" onclick="toggleTimer()">Старт</button>
      <button class="glass-btn" onclick="resetTimer()">Сброс</button>
    </div>

    <!-- Блок времени МСК + таймер чуть выше скраю -->
    <div class="clock-wrapper">
      <div id="activeTimerPill" class="active-timer-pill">
        <span class="timer-pulse"></span>
        <span id="timerText">25:00</span>
      </div>
      <div id="mainDisplay" class="iphone-clock">00:00</div>
    </div>

    <div id="subInfo" class="sub-info">МОСКВА (MSK) • ЗАГРУЗКА...</div>
  </main>

  <!-- Кнопка часов скраю экрана -->
  <button class="side-toggle-btn" id="modeToggleBtn" title="Настроить таймер" onclick="toggleTimerPanel()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"></circle>
      <path d="M12 9v4l2.5 2.5"></path>
      <path d="M9 2h6"></path>
      <path d="M12 2v3"></path>
    </svg>
  </button>

  <!-- Переключатель 4K сцен (> 50 мин) -->
  <div class="bg-switcher">
    <button class="glass-btn" onclick="changeVideo('1-5G6p4207Q')">4K Ночной Токио (1ч+)</button>
    <button class="glass-btn" onclick="changeVideo('eKFTSSKCzWA')">4K Природа и вода (1ч+)</button>
    <button class="glass-btn" onclick="changeVideo('jfKfPfyJRdk')">4K Атмосфера</button>
  </div>

  <script>
    let panelOpen = false;
    let timerSeconds = 25 * 60;
    let initialSeconds = 25 * 60;
    let timerRunning = false;
    let timerInterval = null;

    const mainDisplay = document.getElementById('mainDisplay');
    const subInfo = document.getElementById('subInfo');
    const timerControls = document.getElementById('timerControls');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const activeTimerPill = document.getElementById('activeTimerPill');
    const timerText = document.getElementById('timerText');

    // Обновление времени строго по МСК (Europe/Moscow)
    function updateMoscowClock() {
      const now = new Date();
      const timeStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now);

      const secStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        second: '2-digit'
      }).format(now);

      const dateStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      }).format(now);

      mainDisplay.textContent = timeStr;
      subInfo.textContent = `МОСКВА (MSK) • ${dateStr.toUpperCase()} • ${secStr} СЕК`;
    }

    // Открыть / закрыть панель настройки таймера
    function toggleTimerPanel() {
      panelOpen = !panelOpen;
      if (panelOpen) {
        timerControls.classList.add('active');
        activeTimerPill.classList.add('visible');
        renderTimer();
      } else {
        timerControls.classList.remove('active');
        // Если таймер не запущен, прячем плашку над часами при закрытии меню
        if (!timerRunning && timerSeconds === initialSeconds) {
          activeTimerPill.classList.remove('visible');
        }
      }
    }

    function formatTimer(totalSec) {
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function renderTimer() {
      timerText.textContent = formatTimer(timerSeconds);
    }

    function toggleTimer() {
      activeTimerPill.classList.add('visible');
      activeTimerPill.classList.remove('finished');

      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        startPauseBtn.textContent = 'Старт';
      } else {
        if (timerSeconds <= 0) timerSeconds = initialSeconds;
        timerRunning = true;
        startPauseBtn.textContent = 'Пауза';
        renderTimer();
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            startPauseBtn.textContent = 'Старт';
            timerText.textContent = '00:00 • ГОТОВО';
            activeTimerPill.classList.add('finished');
          }
        }, 1000);
      }
    }

    function setPreset(minutes) {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      initialSeconds = minutes * 60;
      timerSeconds = initialSeconds;
      activeTimerPill.classList.add('visible');
      activeTimerPill.classList.remove('finished');
      renderTimer();
    }

    function applyCustomMinutes() {
      const val = parseInt(document.getElementById('customMinutes').value, 10);
      if (val && val > 0) {
        setPreset(val);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      timerSeconds = initialSeconds;
      activeTimerPill.classList.remove('finished');
      renderTimer();
      if (!panelOpen) {
        activeTimerPill.classList.remove('visible');
      }
    }

    // Смена 4K видео на фоне
    function changeVideo(videoId) {
      const frame = document.getElementById('bgFrame');
      frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&vq=hd2160`;
    }

    updateMoscowClock();
    setInterval(updateMoscowClock, 1000);
  </script>
</body>
</html>
