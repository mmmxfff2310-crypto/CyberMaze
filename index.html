<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSK Clock & YouTube 4K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060911;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Запасной живой фон на случай, если YouTube не загрузился */
    .fallback-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(37, 99, 235, 0.35), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.25), transparent 55%),
        linear-gradient(135deg, #070b14 0%, #10192d 50%, #06080f 100%);
      animation: ambientShift 14s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { filter: hue-rotate(0deg) brightness(0.95); }
      100% { filter: hue-rotate(25deg) brightness(1.08); }
    }

    /* Фоновый 4K плеер YouTube (> 50 мин) */
    .video-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 118vw;
      height: 118vh;
      min-width: 177.77vh;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: none;
      filter: brightness(0.86) contrast(1.06);
      transition: opacity 0.4s ease;
    }

    /* Мягкое затемнение для читаемости */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.62) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* ТАЙМЕР В ПРАВОМ ВЕРХНЕМ УГЛУ (чуть больше) */
    .top-right-timer {
      position: fixed;
      top: 26px;
      right: 32px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      gap: 10px;
    }

    .timer-controls {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      background: rgba(18, 22, 32, 0.52);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      max-width: 92vw;
    }

    .timer-controls.active {
      display: flex;
      animation: fadeIn 0.22s ease;
    }

    .timer-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.72);
    }

    /* Увеличенные цифры таймера в правом верхнем углу */
    .active-timer-display {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(2.6rem, 6vw, 4.8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.94) 0%,
        rgba(255, 255, 255, 0.44) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.38);
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.48));
      animation: fadeIn 0.22s ease;
    }

    .active-timer-display.visible {
      display: block;
    }

    .active-timer-display.done {
      -webkit-text-stroke: 1.5px rgba(74, 222, 128, 0.9);
      animation: pulseDone 1s infinite alternate;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .glass-btn.primary {
      background: rgba(74, 222, 128, 0.32);
      border-color: rgba(74, 222, 128, 0.65);
    }

    .timer-input {
      width: 60px;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 13px;
      text-align: center;
      outline: none;
    }

    /* ОЧЕНЬ БОЛЬШОЕ ВРЕМЯ ПО МСК СКРАЮ ВНИЗУ СЛЕВА */
    .bottom-left-clock {
      position: fixed;
      left: 30px;
      bottom: 24px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .iphone-clock {
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(6.5rem, 16vw, 13.5rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.92) 0%,
        rgba(255, 255, 255, 0.38) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.38);
      filter: drop-shadow(0 14px 36px rgba(0, 0, 0, 0.5));
    }

    .sub-info {
      margin-top: 10px;
      font-size: clamp(0.9rem, 1.35vw, 1.15rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
    }

    /* Кнопка часов скраю справа */
    .side-toggle-btn {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .side-toggle-btn:hover {
      transform: translateY(-50%) scale(1.08);
      background: rgba(255, 255, 255, 0.25);
    }

    .side-toggle-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .side-toggle-btn svg {
      width: 26px;
      height: 26px;
    }

    /* Переключатель YouTube 4K (> 50 мин) справа внизу */
    .bg-switcher {
      position: fixed;
      right: 26px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      max-width: 52vw;
    }

    .yt-url-input {
      width: 195px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(14px);
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .yt-url-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .yt-url-input.error {
      border-color: #f87171;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseDone {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    @media (max-width: 768px) {
      .top-right-timer {
        top: 18px;
        right: 18px;
      }
      .bottom-left-clock {
        left: 18px;
        bottom: 95px;
      }
      .side-toggle-btn {
        right: 16px;
        top: auto;
        bottom: 95px;
        transform: none;
      }
      .bg-switcher {
        left: 18px;
        right: 18px;
        bottom: 18px;
        max-width: none;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Запасной живой фон (не даст экрану быть пустым/серым) -->
  <div class="fallback-bg"></div>

  <!-- Фоновое 4K видео YouTube (> 50 мин) -->
  <div class="video-bg">
    <iframe
      id="bgFrame"
      src="https://www.youtube.com/embed/LXb3EKWsInQ?autoplay=1&mute=1&controls=0&loop=1&playlist=LXb3EKWsInQ&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&vq=hd2160"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="vignette"></div>

  <!-- Таймер в правом верхнем углу (чуть больше) -->
  <section class="top-right-timer">
    <div id="timerControls" class="timer-controls">
      <span class="timer-label">ТАЙМЕР:</span>
      <button class="glass-btn" onclick="setPreset(5)">5 мин</button>
      <button class="glass-btn" onclick="setPreset(15)">15 мин</button>
      <button class="glass-btn" onclick="setPreset(25)">25 мин</button>
      <button class="glass-btn" onclick="setPreset(50)">50 мин</button>
      <input type="number" id="customMinutes" class="timer-input" min="1" max="999" placeholder="Мин" />
      <button class="glass-btn" onclick="applyCustomMinutes()">ОК</button>
      <button id="startPauseBtn" class="glass-btn primary" onclick="toggleTimer()">Старт</button>
      <button class="glass-btn" onclick="resetTimer()">Сброс</button>
    </div>

    <div id="activeTimerDisplay" class="active-timer-display">25:00</div>
  </section>

  <!-- Очень большое время по МСК скраю внизу слева -->
  <div class="bottom-left-clock">
    <div id="mainDisplay" class="iphone-clock">00:00</div>
    <div id="subInfo" class="sub-info">МОСКВА (MSK) • ЗАГРУЗКА...</div>
  </div>

  <!-- Кнопка часов скраю справа -->
  <button class="side-toggle-btn" id="modeToggleBtn" title="Открыть / скрыть таймер" onclick="toggleTimerPanel()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"></circle>
      <path d="M12 9v4l2.5 2.5"></path>
      <path d="M9 2h6"></path>
      <path d="M12 2v3"></path>
    </svg>
  </button>

  <!-- Переключатель YouTube 4K (> 50 мин) + полный экран справа внизу -->
  <div class="bg-switcher">
    <button class="glass-btn" onclick="changeYouTube('LXb3EKWsInQ')">4K Природа (1ч+)</button>
    <button class="glass-btn" onclick="changeYouTube('1-5G6p4207Q')">4K Ночь (1ч+)</button>
    <button class="glass-btn" onclick="changeYouTube('eKFTSSKCzWA')">4K Вода (1ч+)</button>
    <input type="text" id="customYtUrl" class="yt-url-input" placeholder="Ссылка или ID YouTube..." onkeydown="if(event.key==='Enter') applyCustomYouTube()" />
    <button class="glass-btn" onclick="applyCustomYouTube()">ОК</button>
    <button class="glass-btn" onclick="toggleFullscreen()" title="На весь экран">⛶</button>
  </div>

  <script>
    let panelOpen = false;
    let timerSeconds = 25 * 60;
    let initialSeconds = 25 * 60;
    let timerRunning = false;
    let timerInterval = null;

    const mainDisplay = document.getElementById('mainDisplay');
    const subInfo = document.getElementById('subInfo');
    const timerControls = document.getElementById('timerControls');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const activeTimerDisplay = document.getElementById('activeTimerDisplay');
    const ytInput = document.getElementById('customYtUrl');
    const bgFrame = document.getElementById('bgFrame');

    function playSpaChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [528, 660, 792];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.25);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.25);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.25 + 1.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.25);
          osc.stop(ctx.currentTime + idx * 0.25 + 1.8);
        });
      } catch (e) {}
    }

    function updateMoscowClock() {
      const now = new Date();
      const timeStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now);

      const secStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        second: '2-digit'
      }).format(now);

      const dateStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      }).format(now);

      mainDisplay.textContent = timeStr;
      subInfo.textContent = `МОСКВА (MSK) • ${dateStr.toUpperCase()} • ${secStr} СЕК`;
    }

    function toggleTimerPanel() {
      panelOpen = !panelOpen;
      if (panelOpen) {
        timerControls.classList.add('active');
        activeTimerDisplay.classList.add('visible');
        renderTimer();
      } else {
        timerControls.classList.remove('active');
        if (!timerRunning && timerSeconds === initialSeconds) {
          activeTimerDisplay.classList.remove('visible');
        }
      }
    }

    function formatTimer(totalSec) {
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function renderTimer() {
      activeTimerDisplay.textContent = formatTimer(timerSeconds);
    }

    function toggleTimer() {
      activeTimerDisplay.classList.add('visible');
      activeTimerDisplay.classList.remove('done');

      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        startPauseBtn.textContent = 'Старт';
      } else {
        if (timerSeconds <= 0) timerSeconds = initialSeconds;
        timerRunning = true;
        startPauseBtn.textContent = 'Пауза';
        renderTimer();
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            startPauseBtn.textContent = 'Старт';
            activeTimerDisplay.textContent = '00:00';
            activeTimerDisplay.classList.add('done');
            playSpaChime();
          }
        }, 1000);
      }
    }

    function setPreset(minutes) {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      initialSeconds = minutes * 60;
      timerSeconds = initialSeconds;
      activeTimerDisplay.classList.add('visible');
      activeTimerDisplay.classList.remove('done');
      renderTimer();
    }

    function applyCustomMinutes() {
      const val = parseInt(document.getElementById('customMinutes').value, 10);
      if (val && val > 0) {
        setPreset(val);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      timerSeconds = initialSeconds;
      activeTimerDisplay.classList.remove('done');
      renderTimer();
      if (!panelOpen) {
        activeTimerDisplay.classList.remove('visible');
      }
    }

    function extractYouTubeId(input) {
      if (!input) return null;
      const clean = input.trim();
      const match = clean.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(clean)) return clean;
      return null;
    }

    function changeYouTube(videoId) {
      const id = extractYouTubeId(videoId);
      if (!id) return false;
      bgFrame.style.opacity = '0';
      bgFrame.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1&rel=0&showinfo=0&iv_load_policy=3&vq=hd2160`;
      setTimeout(() => {
        bgFrame.style.opacity = '1';
      }, 350);
      ytInput.classList.remove('error');
      try {
        localStorage.setItem('msk_yt_id', id);
      } catch (e) {}
      return true;
    }

    function applyCustomYouTube() {
      const raw = ytInput.value.trim();
      const id = extractYouTubeId(raw);
      if (!id) {
        ytInput.classList.add('error');
        ytInput.value = '';
        ytInput.placeholder = 'Нужна ссылка или ID YouTube';
        return;
      }
      changeYouTube(id);
      ytInput.value = '';
      ytInput.placeholder = 'Ссылка или ID YouTube...';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    try {
      const savedId = localStorage.getItem('msk_yt_id');
      if (savedId && extractYouTubeId(savedId)) {
        changeYouTube(savedId);
      }
    } catch (e) {}

    updateMoscowClock();
    setInterval(updateMoscowClock, 1000);
  </script>
</body>
</html>
