<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSK Clock & Rutube 4K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #1a2436 0%, #090d16 60%, #04060a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Фоновый 4K плеер Rutube */
    .video-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 118vw;
      height: 118vh;
      min-width: 177.77vh;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: none;
      filter: brightness(0.85) contrast(1.05);
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .top-center-stage {
      position: fixed;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: max-content;
      max-width: 94vw;
    }

    .timer-controls {
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(20, 24, 32, 0.48);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .timer-controls.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .timer-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      margin-right: 4px;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .glass-btn.primary {
      background: rgba(74, 222, 128, 0.3);
      border-color: rgba(74, 222, 128, 0.65);
    }

    .timer-input {
      width: 62px;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 13px;
      text-align: center;
      outline: none;
    }

    .active-timer-display {
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(4rem, 11vw, 8.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.92) 0%,
        rgba(255, 255, 255, 0.42) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
      filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.45));
      animation: fadeIn 0.25s ease;
    }

    .active-timer-display.visible {
      display: block;
    }

    .active-timer-display.done {
      -webkit-text-stroke: 1.5px rgba(74, 222, 128, 0.85);
      animation: pulseDone 1s infinite alternate;
    }

    .bottom-left-clock {
      position: fixed;
      left: 28px;
      bottom: 24px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .iphone-clock {
      font-family: -apple-system, BlinkMacSystemFont, 'Rubik', sans-serif;
      font-size: clamp(4.2rem, 9.5vw, 7.2rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.38) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.45));
    }

    .sub-info {
      margin-top: 8px;
      font-size: clamp(0.8rem, 1.15vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .side-toggle-btn {
      position: fixed;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .side-toggle-btn:hover {
      transform: translateY(-50%) scale(1.08);
      background: rgba(255, 255, 255, 0.25);
    }

    .side-toggle-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .side-toggle-btn svg {
      width: 26px;
      height: 26px;
    }

    .bg-switcher {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      max-width: 56vw;
    }

    .rutube-url-input {
      width: 205px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(14px);
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .rutube-url-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .rutube-url-input.error {
      border-color: #f87171;
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.45);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseDone {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    @media (max-width: 768px) {
      .bottom-left-clock {
        left: 18px;
        bottom: 95px;
      }
      .side-toggle-btn {
        right: 16px;
        top: auto;
        bottom: 95px;
        transform: none;
      }
      .bg-switcher {
        left: 18px;
        right: 18px;
        bottom: 18px;
        max-width: none;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="video-bg">
    <iframe
      id="bgFrame"
      src="https://rutube.ru/play/embed/b3e24b7c3298c4f41f57d8499f080747/?autoStart=true&mute=true"
      allow="clipboard-write; autoplay"
      allowfullscreen>
    </iframe>
  </div>

  <div class="vignette"></div>

  <section class="top-center-stage">
    <div id="timerControls" class="timer-controls">
      <span class="timer-label">ТАЙМЕР:</span>
      <button class="glass-btn" onclick="setPreset(5)">5 мин</button>
      <button class="glass-btn" onclick="setPreset(15)">15 мин</button>
      <button class="glass-btn" onclick="setPreset(25)">25 мин</button>
      <button class="glass-btn" onclick="setPreset(50)">50 мин</button>
      <input type="number" id="customMinutes" class="timer-input" min="1" max="999" placeholder="Мин" />
      <button class="glass-btn" onclick="applyCustomMinutes()">ОК</button>
      <button id="startPauseBtn" class="glass-btn primary" onclick="toggleTimer()">Старт</button>
      <button class="glass-btn" onclick="resetTimer()">Сброс</button>
    </div>

    <div id="activeTimerDisplay" class="active-timer-display">25:00</div>
  </section>

  <div class="bottom-left-clock">
    <div id="mainDisplay" class="iphone-clock">00:00</div>
    <div id="subInfo" class="sub-info">МОСКВА (MSK) • ЗАГРУЗКА...</div>
  </div>

  <button class="side-toggle-btn" id="modeToggleBtn" title="Открыть / скрыть таймер" onclick="toggleTimerPanel()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"></circle>
      <path d="M12 9v4l2.5 2.5"></path>
      <path d="M9 2h6"></path>
      <path d="M12 2v3"></path>
    </svg>
  </button>

  <div class="bg-switcher">
    <button class="glass-btn" onclick="changeRutube('b3e24b7c3298c4f41f57d8499f080747')">4K Природа (1ч+)</button>
    <button class="glass-btn" onclick="changeRutube('6129152950929a087665301f530f0146')">4K Ночной город</button>
    <button class="glass-btn" onclick="changeRutube('2044577928496e179144583c92313904')">4K Океан</button>
    <input type="text" id="customRutubeUrl" class="rutube-url-input" placeholder="Ссылка или ID Rutube..." onkeydown="if(event.key==='Enter') applyCustomRutube()" />
    <button class="glass-btn" onclick="applyCustomRutube()">ОК</button>
    <button class="glass-btn" onclick="toggleFullscreen()" title="На весь экран">⛶</button>
  </div>

  <script>
    let panelOpen = false;
    let timerSeconds = 25 * 60;
    let initialSeconds = 25 * 60;
    let timerRunning = false;
    let timerInterval = null;

    const mainDisplay = document.getElementById('mainDisplay');
    const subInfo = document.getElementById('subInfo');
    const timerControls = document.getElementById('timerControls');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const activeTimerDisplay = document.getElementById('activeTimerDisplay');
    const rutubeInput = document.getElementById('customRutubeUrl');

    function playSpaChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [528, 660, 792];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.25);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.25);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.25 + 1.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.25);
          osc.stop(ctx.currentTime + idx * 0.25 + 1.8);
        });
      } catch (e) {}
    }

    function updateMoscowClock() {
      const now = new Date();
      const timeStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now);

      const secStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        second: '2-digit'
      }).format(now);

      const dateStr = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      }).format(now);

      mainDisplay.textContent = timeStr;
      subInfo.textContent = `МОСКВА (MSK) • ${dateStr.toUpperCase()} • ${secStr} СЕК`;
    }

    function toggleTimerPanel() {
      panelOpen = !panelOpen;
      if (panelOpen) {
        timerControls.classList.add('active');
        activeTimerDisplay.classList.add('visible');
        renderTimer();
      } else {
        timerControls.classList.remove('active');
        if (!timerRunning && timerSeconds === initialSeconds) {
          activeTimerDisplay.classList.remove('visible');
        }
      }
    }

    function formatTimer(totalSec) {
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function renderTimer() {
      activeTimerDisplay.textContent = formatTimer(timerSeconds);
    }

    function toggleTimer() {
      activeTimerDisplay.classList.add('visible');
      activeTimerDisplay.classList.remove('done');

      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        startPauseBtn.textContent = 'Старт';
      } else {
        if (timerSeconds <= 0) timerSeconds = initialSeconds;
        timerRunning = true;
        startPauseBtn.textContent = 'Пауза';
        renderTimer();
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            startPauseBtn.textContent = 'Старт';
            activeTimerDisplay.textContent = '00:00';
            activeTimerDisplay.classList.add('done');
            playSpaChime();
          }
        }, 1000);
      }
    }

    function setPreset(minutes) {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      initialSeconds = minutes * 60;
      timerSeconds = initialSeconds;
      activeTimerDisplay.classList.add('visible');
      activeTimerDisplay.classList.remove('done');
      renderTimer();
    }

    function applyCustomMinutes() {
      const val = parseInt(document.getElementById('customMinutes').value, 10);
      if (val && val > 0) {
        setPreset(val);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      startPauseBtn.textContent = 'Старт';
      timerSeconds = initialSeconds;
      activeTimerDisplay.classList.remove('done');
      renderTimer();
      if (!panelOpen) {
        activeTimerDisplay.classList.remove('visible');
      }
    }

    // Универсальное извлечение ID видео Rutube (32 hex-символа из любой ссылки или ID)
    function extractRutubeId(input) {
      if (!input) return null;
      const clean = input.trim();
      const hexMatch = clean.match(/[a-fA-F0-9]{32}/);
      return hexMatch ? hexMatch[0] : null;
    }

    function changeRutube(videoId) {
      const id = extractRutubeId(videoId);
      if (!id) return false;
      const frame = document.getElementById('bgFrame');
      frame.src = `https://rutube.ru/play/embed/${id}/?autoStart=true&mute=true`;
      rutubeInput.classList.remove('error');
      try {
        localStorage.setItem('spa_rutube_id', id);
      } catch (e) {}
      return true;
    }

    function applyCustomRutube() {
      const raw = rutubeInput.value.trim();
      const id = extractRutubeId(raw);
      if (!id) {
        rutubeInput.classList.add('error');
        rutubeInput.value = '';
        rutubeInput.placeholder = 'Нужна ссылка Rutube (32 символа)';
        return;
      }
      changeRutube(id);
      rutubeInput.value = '';
      rutubeInput.placeholder = 'Ссылка или ID Rutube...';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    try {
      const savedId = localStorage.getItem('spa_rutube_id');
      if (savedId && extractRutubeId(savedId)) {
        changeRutube(savedId);
      }
    } catch (e) {}

    updateMoscowClock();
    setInterval(updateMoscowClock, 1000);
  </script>
</body>
</html>
